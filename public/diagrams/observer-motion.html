<desc id="desc">观察者相对房间静止，随半径30公里的星环共同自转、公转。星环负Z轴始终指向地球。左图跟随环心与对地姿态，但不随快速自转；右图从房间观察，地球中心方向固定，太阳与星空反向运动。主图24秒重播一个自转周期。下图独立用32秒展示一圈公转及星环对地转向。姿态为运动学约束，不模拟控制力矩。位置采样自项目函数，图示大小与距离不全按比例。</desc>
