<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e12" />
    <title>星球表面建设 MVP</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sim-stage" id="simStage" aria-label="星球表面三维视图">
        <canvas id="planetCanvas"></canvas>

        <header class="top-strip">
          <div>
            <p class="eyebrow">Planetary Surface Construction</p>
            <h1>泰洛斯 IV</h1>
          </div>
          <div class="planet-stats" id="planetStats"></div>
        </header>

        <nav class="breadcrumb" id="breadcrumb" aria-label="空间层级"></nav>
        <div class="view-badge" id="viewIndicator">宏观 · 星球全景</div>
        <div class="map-tooltip" id="mapTooltip" hidden></div>
        <div class="context-menu" id="contextMenu" role="dialog" aria-label="区块规划选单" hidden></div>

        <div class="terrain-key" id="terrainKey" aria-label="地形图例"></div>
        <div class="interaction-hint" id="interactionHint">
          拖动旋转 · 滚轮缩放 · 悬浮查看 · 双击进入区域
        </div>
      </section>

      <aside class="control-panel" aria-label="建设控制台">
        <section class="panel-section selected-panel" id="selectedPanel"></section>

        <section class="panel-section time-panel">
          <div class="section-title section-title-row">
            <span>行星时间</span>
            <span class="section-note">最小单位 1 小时</span>
          </div>
          <time class="game-clock" id="gameClock" datetime="2100-01-01T00:00:00Z">
            <strong>2100年01月01日</strong>
            <span>00:00</span>
          </time>
          <div class="speed-controls" id="speedControls" aria-label="时间流速">
            <button data-speed="0" type="button" aria-label="暂停时间">暂停</button>
            <button class="active" data-speed="1" type="button">1x</button>
            <button data-speed="6" type="button">6x</button>
            <button data-speed="24" type="button">24x</button>
          </div>
          <div class="time-rate" id="timeRate">1 游戏小时 / 现实秒</div>
        </section>

        <section class="panel-section economy-panel">
          <div class="section-title section-title-row">
            <span>行星经济</span>
            <span class="section-note" id="economyStatus">供应稳定</span>
          </div>
          <div class="economy-grid" id="economyPanel"></div>
          <div class="economy-foot" id="economyFoot"></div>
        </section>

        <section class="panel-section">
          <div class="section-title section-title-row">
            <span>空间层级</span>
            <span class="section-note" id="levelScale">1 区块 ≈ 2,400 km</span>
          </div>
          <div class="level-stack">
            <button class="level-row active" data-level="macro" type="button">
              <span class="level-index">01</span>
              <span><strong>宏观</strong><small>连续地貌区 · 全球战略</small></span>
            </button>
            <button class="level-row" data-level="meso" type="button" disabled>
              <span class="level-index">02</span>
              <span><strong>中观</strong><small>8×8 地块 · 区划与枢纽</small></span>
            </button>
            <button class="level-row" data-level="micro" type="button" disabled>
              <span class="level-index">03</span>
              <span><strong>微观</strong><small>8×8 单元 · 道路与建筑</small></span>
            </button>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-title section-title-row">
            <span>资源情报</span>
            <span class="section-note">所在区划生效</span>
          </div>
          <div class="resource-legend" id="resourceLegend"></div>
        </section>

        <section class="panel-section">
          <div class="section-title">星球政策</div>
          <label class="field-label" for="policySelect">发展方向</label>
          <select id="policySelect">
            <option value="balanced">均衡发展</option>
            <option value="industrial">快速工业化</option>
            <option value="ecology">生态优先</option>
            <option value="research">科研特区</option>
            <option value="military">军事管制</option>
          </select>
          <label class="field-label" for="transportSelect">运输策略</label>
          <select id="transportSelect">
            <option value="balanced">稳定优先</option>
            <option value="speed">速度优先</option>
            <option value="cost">成本优先</option>
          </select>
        </section>

        <section class="panel-section">
          <div class="section-title section-title-row">
            <span>星球事件</span>
            <span class="section-note" id="hubCount">0 个枢纽</span>
          </div>
          <div class="event-log" id="eventLog"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
